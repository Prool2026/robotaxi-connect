project_id = "robotaxi-connect"
[api]
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
[db]
port = 55322
shadow_port = 55320
major_version = 17
[db.seed]
enabled = false
[studio]
port = 55323
[inbucket]
port = 55324
[auth]
site_url = "http://localhost:3100"
additional_redirect_urls = ["http://localhost:3100/de/auth/callback", "http://localhost:3100/en/auth/callback", "http://localhost:3100/de/auth/callback?next=reset-password", "http://localhost:3100/en/auth/callback?next=reset-password"]
enable_signup = true
minimum_password_length = 12
[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
[storage]
file_size_limit = "10MiB"

[auth.email.template.confirmation]
subject = "E-Mail bestätigen / Confirm your email"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Passwort zurücksetzen / Reset your password"
content_path = "./supabase/templates/recovery.html"
